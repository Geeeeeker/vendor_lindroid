name: Build Lindroid APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vendor_lindroid
        uses: actions/checkout@v4
        with:
          repository: Geeeeeker/vendor_lindroid
          ref: lindroid-23.1
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create dummy keystore.properties
        run: |
          # 创建 keystore.properties 文件，内容使用默认 debug 签名信息
          cat > app/keystore.properties << EOF
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "Created dummy keystore.properties"

      - name: Build APK (debug)
        run: |
          if [ -d "app" ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
            cd ..
            apk_path=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -f "$apk_path" ]; then
              cp "$apk_path" Lindroid.apk
              echo "APK built successfully: Lindroid.apk"
            else
              echo "ERROR: No APK found after build"
              exit 1
            fi
          else
            echo "No app directory found, cannot build APK"
            exit 1
          fi

      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: Lindroid.apk
          tag_name: lindroid-apk-${{ steps.timestamp.outputs.time }}
          name: "Lindroid APK (debug) - ${{ steps.timestamp.outputs.time }}"
          body: |
            This is a debug build of Lindroid APK from branch `lindroid-23.1`.

            **Usage**: Install the APK on a device with Lindroid Magisk module and rootfs set up.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Lindroid

on:
  workflow_dispatch:   # 手动触发

permissions:
  contents: write      # 允许创建 Release 和上传资产

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: Geeeeeker/vendor_lindroid   # 替换为你的 Lindroid 仓库
          ref: main

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build native binaries
        run: |
          cd native
          ndk-build
          cd ..

      - name: Package Magisk module
        run: |
          cd magisk_module
          zip -r9 ../Lindroid-Magisk.zip * -x "*.git*"
          cd ..

      - name: Build APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp app/build/outputs/apk/release/*.apk Lindroid.apk

      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Lindroid-Magisk.zip
            Lindroid.apk
          tag_name: lindroid-${{ steps.timestamp.outputs.time }}
          name: "Lindroid Build - ${{ steps.timestamp.outputs.time }}"
          body: |
            This release contains the Magisk module and APK built from the latest source.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
